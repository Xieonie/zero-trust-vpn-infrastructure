name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats wireguard-tools wireguard-go iproute2 nftables argon2 jq openssl qrencode
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Syntax check
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x -S warning

      - name: No LFS pointers in scripts
        run: |
          if grep -rl '^version https://git-lfs.github.com/spec' --include='*.sh' .; then
            echo "Scripts must be stored as regular files, not Git LFS pointers" >&2
            exit 1
          fi

      - name: YAML is well-formed
        run: |
          for f in $(git ls-files '*.yml' '*.yaml'); do yq '.' "$f" >/dev/null || exit 1; done

      - name: Pull Authelia and nginx images for config validation and mTLS handshake tests
        run: |
          docker pull authelia/authelia:4.39
          docker pull nginx:1.27-alpine

      - name: bats
        run: sudo -E env "PATH=$PATH" bats tests/
