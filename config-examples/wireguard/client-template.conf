# WireGuard client configuration, as generated for each device by
# scripts/management/add-user.sh into
# $WG_CLIENTS_DIR/<peer>/<peer>.conf (peer = <user> or <user>--<device>).
# Hand it to the user over a secure channel (or as a QR code) and delete
# your copy of the private key afterwards if policy requires.

[Interface]
PrivateKey = <client private key>
Address = 10.8.0.2/32
# Only present when CLIENT_DNS is set in ztvpn.conf:
# DNS = 10.8.0.1

[Peer]
PublicKey = <server public key>
PresharedKey = <per-peer preshared key>
Endpoint = vpn.example.com:51820
# Split tunnel (default, CLIENT_ALLOWED_IPS): only the tunnel subnet and the
# services subnet go through the VPN.
AllowedIPs = 10.8.0.0/24, 10.0.1.0/24
# Full tunnel: set CLIENT_ALLOWED_IPS=0.0.0.0/0, ::/0 and FULL_TUNNEL=yes in
# ztvpn.conf (the firewall then allows and masquerades IPv4 internet egress).
# ::/0 keeps IPv6 from bypassing the tunnel; the server drops it (no IPv6
# egress through the VPN).
PersistentKeepalive = 25
