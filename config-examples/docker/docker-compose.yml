# zero-trust-vpn container stack.
#
# Deployed to $COMPOSE_DIR (/opt/zero-trust-vpn) together with a .env file
# (see .env.example; scripts/setup/initial-setup.sh writes both).
#
# WireGuard is NOT in here: it runs on the host (wg-quick@wg0) and the host
# nftables table "inet ztvpn" (scripts/setup/firewall-setup.sh) lets VPN
# clients reach only nginx on 443. nginx is the only service with published
# ports; everything else is reachable only through it and Authelia.
#
# Host paths used (all from .env):
#   ${AUTHELIA_DIR} (configuration.yml, users_database.yml)  -> /config (ro)
#   ${AUTHELIA_SECRETS_DIR}/<secret>                        -> /secrets (ro)
#   ${CONFIG_PATH}/nginx/templates/*.template, snippets/    -> nginx
#   ${CERTS_PATH}/server/${AUTH_DOMAIN}.{crt,key}          -> nginx TLS
#
# Optional profile "monitoring" (docker compose --profile monitoring up -d)
# additionally needs, provided by you:
#   ${CONFIG_PATH}/monitoring/prometheus.yml
#   ${CONFIG_PATH}/monitoring/alertmanager.yml
#   ${GRAFANA_ADMIN_PASSWORD_FILE}: one line, readable by uid 472
#     (install -o 472 -m 400 ...), default /etc/zero-trust-vpn/secrets/grafana_admin_password

name: ${COMPOSE_PROJECT_NAME:-zero-trust-vpn}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  authelia:
    image: ${AUTHELIA_IMAGE:-authelia/authelia:4.39}
    restart: unless-stopped
    # Run the binary directly: the image entrypoint would otherwise try to
    # "chown -R /config", which is (and should stay) read-only.
    command: ["authelia"]
    logging: *logging
    environment:
      TZ: ${TZ:-UTC}
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      VPN_SUBNET: ${VPN_SUBNET:?set VPN_SUBNET in .env}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /secrets/redis_password
    volumes:
      # The directory, not single files: the scripts replace
      # users_database.yml atomically (new inode), which a single-file bind
      # mount would never see.
      - ${AUTHELIA_DIR:?set AUTHELIA_DIR in .env}:/config:ro
      - ${AUTHELIA_SECRETS_DIR:?set AUTHELIA_SECRETS_DIR in .env}:/secrets:ro
      - authelia_data:/data
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The image ships wget, not curl.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: authelia
      POSTGRES_USER: authelia
      # Read by the entrypoint while still root, so the 0600 root-owned
      # secret file is fine.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authelia", "-d", "authelia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # The password goes into a config file inside the container instead of
    # onto the command line, so it shows up neither in "docker inspect" nor
    # in the process list. The entrypoint then drops root as usual.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf --appendonly yes
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ:-UTC}
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      VPN_SUBNET: ${VPN_SUBNET:?set VPN_SUBNET in .env}
      # Only these are substituted in /etc/nginx/templates, so nginx's own
      # $variables stay untouched.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|AUTH_DOMAIN|VPN_SUBNET)$$"
    # Bound to this host's address in SERVICES_SUBNET only. Docker-published
    # ports bypass the nftables input chain, so binding to 0.0.0.0 would put
    # the proxy on the internet; this way only VPN clients (and the LAN of
    # SERVICES_SUBNET) can reach it.
    ports:
      - "${PROXY_BIND_ADDR:?set PROXY_BIND_ADDR in .env}:80:80"
      - "${PROXY_BIND_ADDR}:443:443"
    volumes:
      - ${CONFIG_PATH:?set CONFIG_PATH in .env}/nginx/templates:/etc/nginx/templates:ro
      - ${CONFIG_PATH}/nginx/snippets:/etc/nginx/snippets:ro
      # Only the server certificates; the CA key and client keys stay out.
      - ${CERTS_PATH:?set CERTS_PATH in .env}/server:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      authelia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *logging
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://prometheus.${DOMAIN}/
    volumes:
      - ${CONFIG_PATH}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - frontend

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    logging: *logging
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alerts.${DOMAIN}/
    volumes:
      - ${CONFIG_PATH}/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - frontend

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    logging: *logging
    profiles: ["monitoring"]
    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    logging: *logging
    profiles: ["monitoring"]
    # Built-in single-node config. No log shipper is included; point one
    # (e.g. Grafana Alloy) at http://loki:3100 if you want logs in Grafana.
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks:
      - frontend

networks:
  frontend:
  # Databases: no outbound access, reachable only by Authelia.
  backend:
    internal: true

secrets:
  postgres_password:
    file: ${AUTHELIA_SECRETS_DIR}/postgres_password
  redis_password:
    file: ${AUTHELIA_SECRETS_DIR}/redis_password
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-/etc/zero-trust-vpn/secrets/grafana_admin_password}

volumes:
  authelia_data:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
