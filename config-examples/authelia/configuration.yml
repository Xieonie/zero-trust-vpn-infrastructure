# Authelia 4.39 configuration for zero-trust-vpn.
#
# Installed to $AUTHELIA_DIR/configuration.yml by scripts/setup/authelia-setup.sh
# and mounted at /config in the container (see config-examples/docker/docker-compose.yml).
#
# This file contains NO secrets. Each secret is a file in $AUTHELIA_SECRETS_DIR
# (mounted at /secrets) that Authelia reads through *_FILE variables:
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/jwt_secret
#   AUTHELIA_SESSION_SECRET_FILE=/secrets/session_secret
#   AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/storage_encryption_key
#   AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE=/secrets/postgres_password
#   AUTHELIA_SESSION_REDIS_PASSWORD_FILE=/secrets/redis_password
#
# Values like {{ env "DOMAIN" }} are filled in at startup because the container
# runs with X_AUTHELIA_CONFIG_FILTERS=template. Required variables:
# DOMAIN, AUTH_DOMAIN, VPN_SUBNET (set from ztvpn.conf via the compose .env).
#
# Check it with:
#   scripts/setup/authelia-setup.sh --validate
#
# LDAP instead of the users file: replace the authentication_backend section
# with the one in configuration.ldap.yml.

theme: auto

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      auth-request:
        implementation: 'AuthRequest'

log:
  level: info
  format: text

totp:
  disable: false
  issuer: '{{ env "DOMAIN" }}'
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1
  secret_size: 32

webauthn:
  disable: false
  display_name: 'Zero Trust VPN'
  attestation_conveyance_preference: indirect
  timeout: 60s
  selection_criteria:
    user_verification: preferred

identity_validation:
  reset_password:
    jwt_lifespan: 5m
    jwt_algorithm: HS256
  elevated_session:
    code_lifespan: 5m
    elevation_lifespan: 10m

# Users live in /config/users_database.yml and are managed ONLY by the
# scripts (add-user.sh, revoke-user.sh, ...). Authelia must never write the
# file itself, so password reset and change through the portal are off.
authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  # Re-read the user (disabled flag, groups) at most this long after the
  # last check, so disabling or revoking a user ends existing sessions.
  refresh_interval: 1m
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: false
      case_insensitive: false
    # Same parameters as scripts/lib/authelia.sh authelia_hash_password.
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

password_policy:
  standard:
    enabled: true
    min_length: 12
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false

# Only requests from VPN clients are ever allowed. Nothing is bypassed, not
# even for internal networks. Rules are evaluated top to bottom, first match
# wins; anything not matched is denied. A list of subjects means "any of".
# Groups: admins, security, it-support, employees, remote-workers,
# contractors, guests, users, vpn-users, monitoring.
access_control:
  default_policy: deny
  networks:
    - name: vpn
      networks:
        - '{{ env "VPN_SUBNET" }}'
  rules:
    # Monitoring (served by config-examples/nginx)
    - domain: 'grafana.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:admins', 'group:security', 'group:monitoring']
    - domain:
        - 'prometheus.{{ env "DOMAIN" }}'
        - 'alerts.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:admins', 'group:monitoring']

    # Administration and security tooling
    - domain: 'admin.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:admins']
    - domain: 'security.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:admins', 'group:security']
    - domain: 'support.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:admins', 'group:it-support']

    # Staff applications
    - domain: 'intranet.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:employees', 'group:remote-workers']

    # External parties: only their own application, read-only for guests
    - domain: 'projects.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: ['group:contractors', 'group:employees']
    - domain: 'guest.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      methods: ['GET', 'HEAD']
      subject: ['group:guests']

    # Self-service page every VPN user may open
    - domain: 'selfservice.{{ env "DOMAIN" }}'
      policy: two_factor
      networks: ['vpn']
      subject: [['group:users', 'group:vpn-users']]

session:
  name: 'authelia_session'
  same_site: lax
  inactivity: 15m
  expiration: 8h
  # "Remember me" disabled: every session ends after at most 8 hours.
  remember_me: -1
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_DOMAIN" }}'
  redis:
    host: redis
    port: 6379
    database_index: 0

regulation:
  max_retries: 5
  find_time: 5m
  ban_time: 30m

storage:
  postgres:
    address: 'tcp://postgres:5432'
    database: authelia
    username: authelia
    timeout: 5s

# One-time codes (device registration) are written to a file inside the
# container: docker compose exec authelia cat /data/notification.txt
# For e-mail, replace "filesystem" with the smtp block below and add
# AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/secrets/smtp_password to the
# container environment.
notifier:
  disable_startup_check: false
  filesystem:
    filename: /data/notification.txt
  # smtp:
  #   address: 'submission://smtp.example.com:587'
  #   username: 'authelia@example.com'
  #   sender: 'Authelia <authelia@example.com>'
  #   tls:
  #     minimum_version: TLS1.2
