# Authelia users database (file backend), format reference.
#
# Deployed as $AUTHELIA_USERS_DB (/opt/zero-trust-vpn/authelia/users_database.yml,
# mode 600) and managed ONLY by the scripts, which hash passwords with
# argon2id and edit the file safely under a lock:
#   scripts/setup/authelia-setup.sh      creates the file and the first admin
#   scripts/management/add-user.sh       adds users (default groups: users,vpn-users)
#   scripts/management/revoke-user.sh    disables users
# Authelia re-reads the file automatically (watch: true in configuration.yml).
#
# This example deliberately contains no password hashes. Do not copy hashes
# from examples on the internet: a published hash is a published password.
#
# Entry format written by the scripts:
#
# users:
#   alice:
#     disabled: false
#     displayname: "Alice Example"
#     password: "$argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>"
#     email: alice@example.com
#     groups:
#       - users
#       - vpn-users
#
# Groups used by the access_control rules in configuration.yml:
#   admins, security, it-support, employees, remote-workers, contractors,
#   guests, users, vpn-users, monitoring

users: {}
