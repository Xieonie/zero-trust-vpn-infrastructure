# LDAP variant of the authentication_backend section (AUTHELIA_BACKEND=ldap).
#
# Replace the whole "authentication_backend:" section of configuration.yml
# with the one below. Users and groups then live in the directory; the group
# names (cn) must match the ones used in access_control (admins, security,
# it-support, employees, remote-workers, contractors, guests, users,
# vpn-users, monitoring).
#
# The bind password is a secret file, like all others:
#   echo -n '<bind password>' > $AUTHELIA_SECRETS_DIR/ldap_password; chmod 600 ...
# and add to the authelia service environment in docker-compose.yml:
#   AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /secrets/ldap_password
#
# Use ldaps:// (or ldap:// with start_tls: true). Never plain ldap:// without
# StartTLS: the bind and user passwords would cross the network in clear text.

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  refresh_interval: 1m
  ldap:
    implementation: custom
    address: 'ldaps://ldap.example.com:636'
    # With ldap://host:389 use start_tls: true instead.
    start_tls: false
    timeout: 5s
    tls:
      server_name: ldap.example.com
      minimum_version: TLS1.2
      skip_verify: false
    base_dn: 'dc=example,dc=com'
    additional_users_dn: 'ou=users'
    users_filter: '(&({username_attribute}={input})(objectClass=person))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(&(member={dn})(objectClass=groupOfNames))'
    user: 'cn=authelia,ou=service,dc=example,dc=com'
    attributes:
      distinguished_name: distinguishedName
      username: uid
      display_name: displayName
      mail: mail
      member_of: memberOf
      group_name: cn
